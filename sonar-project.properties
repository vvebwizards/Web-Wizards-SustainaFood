sonar.projectKey=vvebwizards_Web-Wizards-SustainaFood
sonar.organization=vvebwizards
sonar.host.url=https://sonarcloud.io

# Source directories
sonar.sources=frontend/src,backend/src

# Coverage reports (Jest lcov format)
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info,backend/coverage/lcov.info

# Optional: exclude test files
sonar.exclusions=**/*.test.js,**/__tests__/**

# For better blame info
sonar.scm.provider=git
